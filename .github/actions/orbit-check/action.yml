name: orbit check
description: >
  Answer, per named job, whether the policy in this PR broke anything the last one
  could do, priced against the evaluation's own noise. Comments the table on the pull
  request and fails the job on a real regression.
author: ORBIT Research

inputs:
  path:
    description: Directory to scan for evaluations.
    required: false
    default: "."
  incumbent:
    description: The policy you ship today. Guessed from file times when omitted.
    required: false
  candidate:
    description: The policy this change proposes. Guessed as the newest when omitted.
    required: false
  target-pp:
    description: The size of drop you want to be able to detect, in points.
    required: false
    default: "10"
  drop-pp:
    description: A job must fall at least this far to count as a regression.
    required: false
    default: "5"
  fail-on-regression:
    description: Fail the job when a regression is called. Set false to comment only.
    required: false
    default: "true"
  comment:
    description: Post the result as a pull-request comment.
    required: false
    default: "true"
  version:
    description: Version of orbit-eval to install.
    required: false
    default: "orbit-eval"

outputs:
  regressed:
    description: Number of jobs called regressed.
    value: ${{ steps.run.outputs.regressed }}
  suspect:
    description: Number of jobs that fell but not beyond measurement noise.
    value: ${{ steps.run.outputs.suspect }}
  report:
    description: Path to the markdown report.
    value: ${{ steps.run.outputs.report }}

runs:
  using: composite
  steps:
    - name: Install orbit-eval
      shell: bash
      run: python3 -m pip install --quiet --disable-pip-version-check "${{ inputs.version }}"

    - name: Run orbit check
      id: run
      shell: bash
      run: |
        set +e
        args=(check "${{ inputs.path }}" --no-open --no-report
              --markdown "$RUNNER_TEMP/orbit.md"
              --out "$RUNNER_TEMP/orbit-record.json"
              --target-pp "${{ inputs.target-pp }}"
              --drop-pp "${{ inputs.drop-pp }}")
        [ -n "${{ inputs.incumbent }}" ] && args+=(--incumbent "${{ inputs.incumbent }}")
        [ -n "${{ inputs.candidate }}" ] && args+=(--candidate "${{ inputs.candidate }}")
        orbit "${args[@]}" | tee "$RUNNER_TEMP/orbit.txt"
        code=${PIPESTATUS[0]}
        set -e
        python3 - "$RUNNER_TEMP/orbit-record.json" >> "$GITHUB_OUTPUT" <<'PY'
        import json, sys
        try:
            c = (json.load(open(sys.argv[1])).get("check") or {})
        except Exception:
            c = {}
        print("regressed=%d" % c.get("n_regressed", 0))
        print("suspect=%d" % c.get("n_suspect", 0))
        PY
        echo "report=$RUNNER_TEMP/orbit.md" >> "$GITHUB_OUTPUT"
        echo "exit=$code" >> "$GITHUB_OUTPUT"
        # The step itself never fails here; the gate below decides, so the comment
        # is always posted even when a regression is found.
        exit 0

    - name: Summary
      shell: bash
      run: cat "$RUNNER_TEMP/orbit.md" >> "$GITHUB_STEP_SUMMARY" || true

    - name: Comment on the pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = `${process.env.RUNNER_TEMP}/orbit.md`;
          if (!fs.existsSync(path)) return;
          const body = fs.readFileSync(path, 'utf8') + '\n<!-- orbit-check -->';
          const {owner, repo} = context.repo;
          const issue_number = context.issue.number;
          // One comment that is edited in place, so a long PR does not accumulate
          // a wall of near-identical tables.
          const existing = await github.paginate(github.rest.issues.listComments,
            {owner, repo, issue_number});
          const mine = existing.find(c => c.body && c.body.includes('<!-- orbit-check -->'));
          if (mine) {
            await github.rest.issues.updateComment({owner, repo, comment_id: mine.id, body});
          } else {
            await github.rest.issues.createComment({owner, repo, issue_number, body});
          }

    - name: Fail on regression
      if: ${{ inputs.fail-on-regression == 'true' }}
      shell: bash
      run: |
        n="${{ steps.run.outputs.regressed }}"
        if [ "${n:-0}" -gt 0 ]; then
          echo "::error::orbit check: $n job(s) regressed beyond measurement noise."
          exit 1
        fi
        echo "orbit check: no job regressed beyond measurement noise."
